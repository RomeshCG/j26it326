# ---- Income pattern (B3) ----
[income_pattern]
regular = 0.8
fairly_regular = 1.0
irregular = 1.5

# ---- Debt burden: other-loan payments as a fraction of monthly income (B1) ----
# bands: none | < e1 | e1-e2 | e2-e3 | > e3
[debt_burden]
edges = [0.2, 0.4, 0.6]
rr = [0.7, 0.9, 1.2, 1.8, 2.8]

# ---- Instalment load: this loan's monthly instalment / monthly income (B2) ----
# bands: < e1 | e1-e2 | e2-e3 | > e3
[instalment_load]
edges = [0.1, 0.2, 0.3]
rr = [0.8, 1.0, 1.5, 2.4]

# ---- Age (A2, B5): [low, high) bands ----
[age]
bands = [[18, 25], [25, 35], [35, 45], [45, 55], [55, 70]]
shares = [0.07, 0.25, 0.33, 0.25, 0.10]
rr = [1.4, 1.1, 1.0, 0.9, 1.1]

# ---- Dependants (A3, B5): inclusive integer bands ----
[dependants]
bands = [[0, 2], [3, 4], [5, 7]]
shares = [0.55, 0.35, 0.10]
rr = [0.9, 1.1, 1.5]

# ---- Business age in years, self-employed only (A4, B4) ----
[business_age]
bands = [[0.0, 1.0], [1.0, 3.0], [3.0, 15.0]]
shares = [0.20, 0.30, 0.50]
rr = [1.6, 1.1, 0.8]

# ---- Borrowing history (A4, B5) ----
[first_time]
share = 0.20
rr_first = 1.3
rr_repeat = 0.8

# ---- Assets (A5, B5) ----
[assets]
names = ["land_or_house", "vehicle_or_equipment", "none"]
shares = [0.45, 0.20, 0.35]
rr = [0.8, 0.9, 1.3]

# ---- Civil status (A3). No risk effect unless the expert says otherwise ----
[civil_status]
names = ["married", "single", "widowed_or_separated"]
shares = [0.78, 0.10, 0.12]
rr = [1.0, 1.0, 1.0]
