# Expert-elicited priors for the v3 (expert-enriched) M1 model.
#
# !! PLACEHOLDER VALUES !!  Every number below is a stand-in so the pipeline can be built and
# tested before the resource person answers the questionnaire
# (internalDocs/M1_RESOURCE_PERSON_QUESTIONNAIRE.md). Replace them with the expert's numbers,
# then set placeholder = false. Generated data is tagged "expert_prior_placeholder" until then.
placeholder = true

# Where each section comes from in the questionnaire:
#   [[occupation]] .......... A1 (shares, income, expenses, other debt) and B6 (rr)
#   [age], [dependants] ..... A2, A3 and B5
#   [business_age], [first_time], [assets] .... A4, A5, B4, B5
#   [debt_burden], [instalment_load], [income_pattern] .... B1, B2, B3
#
# "rr" = relative risk: how many times more likely than a typical borrower to fall seriously
# behind (1.0 = typical). All risk multipliers are combined by multiplication (see B7).

[monthly_factor]            # how many instalments per month, by PAR product_type
Weekly = 4.333
Daily = 30.0
Monthly = 1.0

# ---- Occupation (shares should sum to ~1; incomes are LKR per month) ----
[[occupation]]
name = "Small shop / trader"
share = 0.22
income_low = 40000
income_typical = 70000
income_high = 130000
expenses = 40000
p_other_loans = 0.35
other_debt_typical = 8000
self_employed = true
income_pattern = "fairly_regular"
rr = 1.0

[[occupation]]
name = "Farmer / agriculture"
share = 0.22
income_low = 25000
